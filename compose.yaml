name: monad-blitz-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monad_blitz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MONAD_POSTGRES_PASSWORD:?Renseigner MONAD_POSTGRES_PASSWORD dans .env}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d monad_blitz']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres-data:
