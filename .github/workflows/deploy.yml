name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          for secret in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Vercel access
        run: |
          node --input-type=module <<'NODE'
          const orgId = encodeURIComponent(process.env.VERCEL_ORG_ID);
          const projectId = encodeURIComponent(process.env.VERCEL_PROJECT_ID);
          const endpoints = [
            ['team', `https://api.vercel.com/teams/${orgId}`],
            ['project', `https://api.vercel.com/v9/projects/${projectId}?teamId=${orgId}`],
          ];
          for (const [resource, url] of endpoints) {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
              signal: AbortSignal.timeout(15000),
            });
            console.log(`Vercel ${resource} access: HTTP ${response.status}`);
            if (!response.ok) {
              console.error(`::error::VERCEL_TOKEN cannot access the configured ${resource}. Check its scope and the Vercel IDs.`);
              process.exitCode = 1;
            }
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Install Vercel CLI
        run: pnpm add --global vercel@59.10.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production

      - name: Build production
        run: vercel build --prod

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --yes)
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Production deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
